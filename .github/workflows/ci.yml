name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The app role must not be a superuser, or Postgres skips row-level security.
      TEST_DATABASE_URL: postgresql://orgchart:orgchart@localhost:5432/orgchart_test
      DATABASE_URL: postgresql://orgchart:orgchart@localhost:5432/orgchart_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create app role and test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE orgchart LOGIN PASSWORD 'orgchart'"
          psql -h localhost -U postgres -c "CREATE DATABASE orgchart_test OWNER orgchart"
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
